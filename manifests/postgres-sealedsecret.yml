# Credenciales de PostgreSQL cifradas con Sealed Secrets (kubeseal).
# Solo el controlador del clúster tiene la clave privada para descifrarlas; en Git no hay texto plano.
# El controlador crea con esto el Secret credenciales-postgres en el namespace developer-hub.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: credenciales-postgres
  namespace: developer-hub
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: credenciales-postgres
      namespace: developer-hub

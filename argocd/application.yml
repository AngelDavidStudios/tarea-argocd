# Application de Argo CD. Se aplica una sola vez:
#   kubectl apply -f argocd/application.yml
# Desde ahí Argo CD sincroniza solo la carpeta manifests/ de este repositorio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AngelDavidStudios/tarea-argocd.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: developer-hub
  syncPolicy:
    automated:
      prune: true      # borra del clúster lo que se quite del repo
      selfHeal: true   # revierte cambios hechos a mano en el clúster
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # El HPA cambia spec.replicas: sin esto Argo CD lo vería como OutOfSync y lo devolvería a 2
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: developer-hub
      jsonPointers:
        - /spec/replicas

# Controlador de Sealed Secrets, instalado también por GitOps.
# Descifra los SealedSecret del repositorio y crea los Secret reales dentro del clúster.
# Se aplica una sola vez:  kubectl apply -f argocd/sealed-secrets.yml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: helm-v2.22.0          # chart 2.22.0 = controlador 0.41.2 (multi-arch, incluye arm64)
    path: helm/sealed-secrets
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # nombre que kubeseal busca por defecto
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

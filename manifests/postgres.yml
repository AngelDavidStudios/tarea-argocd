# PostgreSQL compartido por todas las réplicas de Developer Hub.
# Guarda el catálogo y las claves de firma de sesión: así cualquier réplica valida
# el token de cualquier otra y los Pods de Developer Hub quedan sin estado (escalables).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credenciales
  labels:
    app: postgres
type: Opaque
stringData:
  # Credenciales de laboratorio: la base solo es accesible dentro del clúster (Service ClusterIP)
  POSTGRES_USER: rhdh
  POSTGRES_PASSWORD: rhdh-demo-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-datos
  labels:
    app: postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # el volumen es ReadWriteOnce: nunca dos Pods a la vez
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70     # usuario postgres de la imagen alpine
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          # Cada réplica de Developer Hub abre un pool por plugin (~18 conexiones): con 5 réplicas hacen falta más de 100
          args: ["-c", "max_connections=150", "-c", "shared_buffers=64MB"]
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credenciales
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: postgres-datos
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
